<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>My Home Weather Station</title>
    <script>
        // Set theme before first paint to avoid a flash: saved choice, else system preference
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg: #0d0e11;
            --surface: #14161b;
            --border: #21252d;
            --text: #f1f3f5;
            --muted: #8b94a0;
            --accent: #38bdf8;
            --purple: #c084fc;
            --green: #34d399;
            --red: #f87171;
            --logo-bg: #1a2333;
            --logo-border: #2a3b55;
            --grid: rgba(33,37,45,0.5);
            --shadow: none;
            --font-mono: "JetBrains Mono", Consolas, monospace;
            --font-sans: system-ui, -apple-system, sans-serif;
        }
        :root[data-theme="light"] {
            --bg: #f3f5f8;
            --surface: #ffffff;
            --border: #dde2ea;
            --text: #14161b;
            --muted: #5b6573;
            --accent: #0284c7;
            --purple: #9333ea;
            --green: #059669;
            --red: #dc2626;
            --logo-bg: #e3f1fb;
            --logo-border: #b9dcf3;
            --grid: rgba(20,22,27,0.08);
            --shadow: 0 1px 3px rgba(20,22,27,0.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: var(--bg); color: var(--text);
            font-family: var(--font-sans);
            transition: background 0.25s, color 0.25s;
        }
        main { max-width: 1120px; margin: auto; padding: 40px 24px; }
        header {
            display: flex; justify-content: space-between; align-items: flex-end;
            gap: 20px; flex-wrap: wrap; margin-bottom: 30px;
            border-bottom: 1px solid var(--border); padding-bottom: 20px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo {
            width: 44px; height: 44px; border-radius: 10px;
            display: grid; place-items: center; color: var(--accent);
            background: var(--logo-bg); border: 1px solid var(--logo-border); font-weight: 600;
        }
        h1 { font-size: 22px; font-weight: 600; margin: 0; }
        .subtitle { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
        .header-right { display: flex; align-items: center; gap: 14px; }
        #status { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
        .theme-btn {
            width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
            display: grid; place-items: center; font-size: 17px; line-height: 1;
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }
        .theme-btn:hover { border-color: var(--accent); }
        .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* Metrics Grid */
        .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; box-shadow: var(--shadow);
            transition: background 0.25s, border-color 0.25s;
        }
        .metric-label { color: var(--muted); font-size: 13px; font-weight: 500; }
        .metric-val { font-size: clamp(36px, 4vw, 48px); font-weight: 600; margin: 12px 0 6px; font-family: var(--font-mono); }
        .unit { font-size: 18px; color: var(--muted); font-weight: 400; }
        .stats { color: var(--muted); font-size: 12px; font-family: var(--font-mono); }

        /* Charts Grid */
        .charts-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .chart-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
            transition: background 0.25s, border-color 0.25s;
        }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chart-header h3 { margin: 0; font-size: 15px; }
        .chart-current { font-family: var(--font-mono); font-size: 14px; }
        .canvas-container { height: 260px; position: relative; }

        @media(max-width: 768px) {
            .metrics, .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="brand">
                <div class="logo">☁️</div>
                <div>
                    <h1>Home Weather Station</h1>
                    <div class="subtitle">Cloud Telemetry &amp; Chart.js Engine</div>
                </div>
            </div>
            <div class="header-right">
                <div id="status">Ready to connect</div>
                <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">🌙</button>
            </div>
        </header>

        <!-- Metrics Cards -->
        <div class="metrics">
            <div class="card">
                <div class="metric-label">Latest Temperature</div>
                <div class="metric-val"><span id="tempVal">--.-</span><span class="unit">°C</span></div>
                <div class="stats" id="tempStats">min -- · avg -- · max --</div>
            </div>
            <div class="card">
                <div class="metric-label">Latest Humidity</div>
                <div class="metric-val"><span id="humVal">--</span><span class="unit">%</span></div>
                <div class="stats" id="humStats">min -- · avg -- · max --</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3>Temperature Trend</h3>
                    <span class="chart-current" id="tempCurr">-- °C</span>
                </div>
                <div class="canvas-container">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3>Humidity Trend</h3>
                    <span class="chart-current" id="humCurr">-- %</span>
                </div>
                <div class="canvas-container">
                    <canvas id="humChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        Chart.defaults.font.family = 'JetBrains Mono, monospace';
        Chart.defaults.font.size = 11;

        // ===== CONFIG: set your ThingSpeak details here =====
        const CHANNEL_ID = '3549758';
        const API_KEY    = 'R68UDB7TJSGF6EAO';    // Read API key (set to '' for public channels)
        // ====================================================

        const REFRESH_MS = 20000; // ThingSpeak free tier updates at most every 15s
        let tempChart, humChart;
        let refreshTimer = null;
        let loading = false;
        let fullTimes = []; // full date+time per point, used in tooltips

        /* ---------- Theme ---------- */
        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        }

        // Re-colour charts from the active theme's CSS variables
        function applyChartTheme() {
            if (!tempChart || !humChart) return;
            const muted = cssVar('--muted');
            const grid = cssVar('--grid');
            [[tempChart, cssVar('--accent')], [humChart, cssVar('--purple')]].forEach(([chart, color]) => {
                const ds = chart.data.datasets[0];
                ds.borderColor = color;
                ds.backgroundColor = color + '22';
                ds.pointBackgroundColor = color;
                chart.options.scales.x.ticks.color = muted;
                chart.options.scales.y.ticks.color = muted;
                chart.options.scales.y.grid.color = grid;
                chart.update('none');
            });
        }

        function setTheme(theme, save) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeBtn').textContent = theme === 'light' ? '☀️' : '🌙';
            if (save) { try { localStorage.setItem('theme', theme); } catch (e) {} }
            applyChartTheme();
        }

        /* ---------- Charts ---------- */
        function makeChart(id) {
            return new Chart(document.getElementById(id).getContext('2d'), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        data: [], borderWidth: 2, fill: true, tension: 0.3,
                        spanGaps: false, // missing readings show as gaps, not zeros
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: { title: items => fullTimes[items[0].dataIndex] || items[0].label }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 6, maxRotation: 0 } },
                        y: { grid: {} }
                    }
                }
            });
        }

        function initCharts() {
            tempChart = makeChart('tempChart');
            humChart = makeChart('humChart');
            applyChartTheme();
        }

        // Returns a number, or null for missing / non-numeric readings
        function toNum(v) {
            if (v === null || v === undefined || v === '') return null;
            const n = parseFloat(v);
            return Number.isFinite(n) ? n : null;
        }

        function lastValid(arr) {
            for (let i = arr.length - 1; i >= 0; i--) if (arr[i] !== null) return arr[i];
            return null;
        }

        function summarize(arr, digits) {
            const v = arr.filter(x => x !== null);
            if (!v.length) return 'min -- · avg -- · max --';
            const avg = v.reduce((a, b) => a + b, 0) / v.length;
            return `min ${Math.min(...v).toFixed(digits)} · avg ${avg.toFixed(digits)} · max ${Math.max(...v).toFixed(digits)}`;
        }

        // Time only if all points fall on the same day; otherwise include the date
        function makeLabels(dates) {
            const multiDay = new Set(dates.map(d => d.toDateString())).size > 1;
            return dates.map(d => multiDay
                ? d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        }

        function setStatus(text, color) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.style.color = color;
        }

        async function fetchWeatherData() {
            if (loading) return;
            if (!/^\d+$/.test(CHANNEL_ID)) {
                setStatus('Set CHANNEL_ID at the top of the script.', 'var(--red)');
                return;
            }

            loading = true;
            setStatus('Fetching data from ThingSpeak...', 'var(--accent)');

            // Only send api_key when one is set (public channels need none)
            let url = `https://api.thingspeak.com/channels/${encodeURIComponent(CHANNEL_ID)}/feeds.json?results=30`;
            if (API_KEY) url += `&api_key=${encodeURIComponent(API_KEY)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                const feeds = data.feeds;
                if (!feeds || feeds.length === 0) {
                    setStatus('No data found for this channel.', 'var(--red)');
                    return;
                }

                const dates = feeds.map(f => new Date(f.created_at));
                const labels = makeLabels(dates);
                fullTimes = dates.map(d => d.toLocaleString());
                const tempData = feeds.map(f => toNum(f.field1));
                const humData = feeds.map(f => toNum(f.field2));

                const latestTemp = lastValid(tempData);
                const latestHum = lastValid(humData);

                document.getElementById('tempVal').textContent = latestTemp === null ? '--.-' : latestTemp.toFixed(1);
                document.getElementById('humVal').textContent = latestHum === null ? '--' : latestHum.toFixed(0);
                document.getElementById('tempCurr').textContent = latestTemp === null ? '-- °C' : latestTemp.toFixed(1) + ' °C';
                document.getElementById('humCurr').textContent = latestHum === null ? '-- %' : latestHum.toFixed(0) + ' %';
                document.getElementById('tempStats').textContent = summarize(tempData, 1);
                document.getElementById('humStats').textContent = summarize(humData, 0);

                tempChart.data.labels = labels;
                tempChart.data.datasets[0].data = tempData;
                tempChart.update();

                humChart.data.labels = labels;
                humChart.data.datasets[0].data = humData;
                humChart.update();

                setStatus(`Synced at ${new Date().toLocaleTimeString()}`, 'var(--green)');
                scheduleRefresh();
            } catch (err) {
                console.error(err);
                setStatus('Error fetching cloud data. Check CHANNEL_ID / API_KEY.', 'var(--red)');
            } finally {
                loading = false;
            }
        }

        function scheduleRefresh() {
            if (!refreshTimer) refreshTimer = setInterval(fetchWeatherData, REFRESH_MS);
        }

        window.onload = () => {
            initCharts();
            setTheme(currentTheme(), false); // sync button icon + chart colours

            document.getElementById('themeBtn').addEventListener('click', () => {
                setTheme(currentTheme() === 'light' ? 'dark' : 'light', true);
            });

            // Follow system changes only if the user hasn't picked a theme manually
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
                    let saved = null;
                    try { saved = localStorage.getItem('theme'); } catch (err) {}
                    if (!saved) setTheme(e.matches ? 'light' : 'dark', false);
                });
            }

            fetchWeatherData(); // load automatically on open
        };
    </script>
</body>
</html>
